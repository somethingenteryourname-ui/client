name: Build VANTA Client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: VANTA-Client-Source/vanta-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Check the jar
        run: |
          ls -la build/libs/
          unzip -l build/libs/VANTA-Client-1.21.11.jar | grep -E "fabric.mod.json|vanta.mixins.json|VantaClient.class"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: VANTA-Client-1.21.11
          path: VANTA-Client-Source/vanta-client/build/libs/VANTA-Client-1.21.11.jar
